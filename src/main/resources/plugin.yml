name: AreaPickaxes
main: com.df15.areapickaxes.AreaPickaxes
version: '1.1.0'
api-version: '26.2'
description: Admin-given pickaxes that mine a rectangular area (2x2, 3x3, 2x3...) around the block you break.
author: Lorealex
load: POSTWORLD
softdepend: [GrimAC]
commands:
  apick:
    description: Give an area-mining pickaxe
    usage: "/apick give <player> <WIDTHxHEIGHT> [material]"
    permission: areapickaxes.admin.give
permissions:
  areapickaxes.admin.give:
    description: Allows /apick give
    default: op
